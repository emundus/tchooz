PLG_TASK_PURGEIMPORTS="Purge des imports terminés depuis n jours"
PLG_TASK_PURGEIMPORTS_XML_DESCRIPTION="Cette tâche planifiée supprime automatiquement les imports terminés (réussis ou en échec) il y a plus d'un certain nombre de jours : le fichier source persisté et la ligne de suivi sont effacés. Cela libère de l'espace de stockage et garde le système propre."
