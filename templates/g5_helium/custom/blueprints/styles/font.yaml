name: Fonts
description: Fonts
type: core

form:
  fields:
    family-title:
      type: input.fonts
      label: Title Font
      default: 'Inter'
    size-h1:
      type: input.text
      label: H1 font size
      default: '32px'
    weight-h1:
      type: input.text
      label: H1 font weight
      default: '500'
    text-transform-h1:
      type: select.select
      label: H1 text transform
      default: 'none'
      options:
        uppercase: Uppercase
        lowercase: Lowercase
        capitalize: Capitalize
        none: None
